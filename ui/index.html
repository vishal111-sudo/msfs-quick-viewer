<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <!-- Nothing remote and no script but the app's own. style-src-attr allows
         inline style *attributes* only, which the component libraries set
         (a progress bar's width, a popup's position). Inline <style> blocks
         stay blocked, except NumberFlow's, whose exact contents are added to
         style-src by hash at build time (vite.config.mjs). Fonts are bundled,
         never data: URLs. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src msfsart: data:; font-src 'self';"
    />
    <title>MSFS Quick Viewer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.jsx"></script>
  </body>
</html>
